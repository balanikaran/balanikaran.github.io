name: Bug report
description: Report a problem with the website.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue and what you expected to happen.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://karanbalani.tech/
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include browser/device details if relevant.
    validations:
      required: false
